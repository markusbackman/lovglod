; LövGlöd LED-lampa — ESP32 + WS2812B eller APA102 (väljs i setup-portalen)
; Bygg:            pio run
; Flasha via USB:  pio run -t upload
; Seriell monitor: pio device monitor

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@^6.9.0     ; Arduino core 2.0.x — mest beprövad med FastLED + WiFiClientSecure
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; min_spiffs ger två app-partitioner på ~1.9 MB vardera.
; Krävs för OTA när binären växer med TLS + FastLED + ArduinoJson.
board_build.partitions = min_spiffs.csv

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DFASTLED_ESP32_I2S=0          ; RMT-driver, stabilast på klassisk ESP32
    -DFASTLED_RMT_MAX_CHANNELS=1

lib_deps =
    fastled/FastLED@^3.9.9
    bblanchon/ArduinoJson@^7.2.0

[env:esp32dev]
upload_protocol = esptool
; Kopplingstestet har egen setup()/loop() och får inte länkas in här.
build_src_filter = +<*> -<wiring_test.cpp>

; Kopplingstest — bara hårdvara, inget WiFi och ingen SHL-data.
;   pio run -e esp32dev_wiring -t upload && pio device monitor
[env:esp32dev_wiring]
upload_protocol = esptool
build_src_filter = -<*> +<wiring_test.cpp>

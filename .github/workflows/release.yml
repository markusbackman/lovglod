name: Release firmware

# Taggar du v1.2.3 byggs firmwaren och publiceras som en release.
# Lamporna hittar den via GitHub Releases-API:t och uppdaterar sig själva.
#
# En version med suffix (v1.3.0-rc1, v1.3.0-beta.2) publiceras som pre-release
# och når bara lampor i betaprogrammet. Stabila lampor läser /releases/latest,
# som aldrig returnerar en pre-release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version att bygga, utan v (1.2.3 = stabil, 1.3.0-rc1 = beta)'
        required: true

permissions:
  contents: write          # krävs för att skapa releasen

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Bestäm version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          # Vägra tvetydiga versioner — enheten jämför strängen rakt av.
          # Tillåter 1.2.3 och 1.3.0-rc1, men inte "v1.2.3" eller tomt.
          if ! printf '%s' "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Ogiltig version: '$V' (förväntar 1.2.3 eller 1.3.0-rc1)"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V"    >> "$GITHUB_OUTPUT"
          echo "Bygger version $V"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cachea PlatformIO-verktygskedjan
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Installera PlatformIO
        # esptool pinnas: v5 döpte om merge_bin till merge-bin och bytte
        # standardvärden, så en oväntad major skulle knäcka bygget tyst.
        run: pip install --upgrade platformio "esptool~=4.8"

      - name: Bygg firmware
        env:
          # Injiceras i FW_VERSION. config.h har #ifndef, så den här vinner.
          PLATFORMIO_BUILD_FLAGS: -DFW_VERSION='"${{ steps.ver.outputs.version }}"'
        run: pio run -e esp32dev

      - name: Paketera, signera och kontrollera
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp .pio/build/esp32dev/firmware.bin dist/firmware.bin

          V='${{ steps.ver.outputs.version }}'
          TAG='${{ steps.ver.outputs.tag }}'
          SIZE=$(stat -c%s dist/firmware.bin)
          SHA=$(sha256sum dist/firmware.bin | cut -d' ' -f1)

          # Enheterna vägrar osignerad firmware. Utan nyckel finns det inget att
          # publicera — bättre att stanna här än att lägga ut en release som
          # varenda lampa tackar nej till.
          if [ -z "${OTA_SIGNING_KEY:-}" ]; then
            echo "::error::Secreten OTA_SIGNING_KEY saknas. Kör tools/generate-ota-key.sh och gh secret set OTA_SIGNING_KEY."
            exit 1
          fi

          umask 077
          printf '%s\n' "$OTA_SIGNING_KEY" > signing_key.pem
          openssl dgst -sha256 -sign signing_key.pem -out dist/firmware.sig dist/firmware.bin
          rm -f signing_key.pem
          SIG=$(base64 -w0 dist/firmware.sig)

          # Kontrollera mot den publika nyckel som faktiskt ligger i binären.
          # Roterar någon den privata nyckeln utan att köra om
          # tools/generate-ota-key.sh fångas det här, i stället för av en flotta
          # lampor som tyst slutar uppdatera sig.
          sed -n '/-----BEGIN PUBLIC KEY-----/,/-----END PUBLIC KEY-----/p' \
              include/ota_pubkey.h > dist/pubkey.pem
          if ! openssl dgst -sha256 -verify dist/pubkey.pem \
                 -signature dist/firmware.sig dist/firmware.bin; then
            echo "::error::Signaturen går inte att verifiera med include/ota_pubkey.h — nyckelparet matchar inte"
            exit 1
          fi
          rm -f dist/pubkey.pem

          # min_spiffs.csv ger 1 966 080 byte per app-partition. Går binären
          # över taket misslyckas OTA på enheten, inte här — fånga det nu.
          LIMIT=1966080
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::firmware.bin är $SIZE byte, taket är $LIMIT"
            exit 1
          fi

          # Verifiera att versionen faktiskt hamnade i binären.
          if ! strings dist/firmware.bin | grep -q "LovGlod/$V"; then
            echo "::error::FW_VERSION $V återfinns inte i binären"
            exit 1
          fi

          # Manifestet bär det binären inte kan bära om sig själv, och används
          # både av GitHub-vägen och av enheter som pekas mot en egen
          # webbserver. Enheten
          # hämtar det som en egen asset ur releasen och vägrar installera om
          # sha256 eller sig saknas.
          cat > dist/firmware.json <<EOF
          {
            "version": "$V",
            "url": "https://github.com/${{ github.repository }}/releases/download/$TAG/firmware.bin",
            "sha256": "$SHA",
            "size": $SIZE,
            "sig": "$SIG"
          }
          EOF

          # Komplett flashbild för ett kort som aldrig kört LövGlöd. firmware.bin
          # är bara appen; utan bootloader och partitionstabell (min_spiffs, två
          # app-partitioner) går kortet inte att starta och OTA får ingen plats
          # att skriva till. Den här bilden skrivs till offset 0 och behöver
          # inget lokalt bygge.
          #
          # Bilden är till för USB. Enheterna hämtar aldrig den — de tar
          # firmware.bin via manifestet, och det är den vägen som är signerad.
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 \
                        -name boot_app0.bin -print -quit)
          if [ -z "$BOOT_APP0" ]; then
            echo "::error::boot_app0.bin hittades inte i framework-paketet"
            exit 1
          fi
          esptool.py --chip esp32 merge_bin -o dist/lovglod-full.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000  .pio/build/esp32dev/bootloader.bin \
            0x8000  .pio/build/esp32dev/partitions.bin \
            0xe000  "$BOOT_APP0" \
            0x10000 dist/firmware.bin

          # Kontrollsumman följer med som egen asset, så den går att verifiera
          # med  shasum -a 256 -c lovglod-full.bin.sha256  efter nedladdning.
          FULL_SIZE=$(stat -c%s dist/lovglod-full.bin)
          ( cd dist && sha256sum lovglod-full.bin > lovglod-full.bin.sha256 )
          FULL_SHA=$(cut -d' ' -f1 dist/lovglod-full.bin.sha256)

          echo "### Firmware $V" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Storlek | $SIZE byte ($(( SIZE * 100 / LIMIT )) % av partitionen) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SHA-256 | \`$SHA\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Signatur | verifierad mot \`include/ota_pubkey.h\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Full flashbild | $FULL_SIZE byte, sha256 \`$FULL_SHA\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicera release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # Kanalen följer versionen, inte ett separat val — så kan en rc aldrig
          # råka hamna hos stabila lampor.
          case "$V" in
            *-*) PRE=true ;;
            *)   PRE=false ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/firmware.bin dist/firmware.json dist/firmware.sig \
              dist/lovglod-full.bin dist/lovglod-full.bin.sha256 --clobber
            gh release edit "$TAG" --prerelease="$PRE"
          else
            gh release create "$TAG" dist/firmware.bin dist/firmware.json dist/firmware.sig \
              dist/lovglod-full.bin dist/lovglod-full.bin.sha256 \
              --title "v$V" --generate-notes --prerelease="$PRE"
          fi
          echo "Kanal: $([ "$PRE" = true ] && echo beta || echo stabil)"
          echo "Publicerad: $(gh release view "$TAG" --json url -q .url)"

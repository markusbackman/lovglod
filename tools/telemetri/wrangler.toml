name = "lovglod-telemetri"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

# Översiktssidan och logotyperna buntas in som text.
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.svg"]
fallthrough = false

# Rensar rapporter äldre än RETENTION_DAYS en gång per natt, och skickar
# veckobrevet på måndagsmorgonen (UTC; samma sträng som WEEKLY_CRON i index.js).
[triggers]
crons = ["17 3 * * *", "41 5 * * 1"]

[vars]
# Samma sträng som TELEMETRY_KEY i include/config.h. Den är inte hemlig — den
# ligger i varje binär — och finns bara för att sortera bort slumpmässiga anrop.
LAMP_KEY = "lovglod-telemetri-1"
RETENTION_DAYS = "365"
# Sätt för att be lamporna rapportera med ett annat intervall (sekunder,
# 3600–172800). Tomt = lampans eget, var sjätte timme.
INTERVAL_S = ""

# Länken i pushnotiser och veckobrev.
DASHBOARD_URL = "https://lovglod-telemetri.lovglod.workers.dev/"
# Pushservern för signalen om nya lampor. Ämnet (NTFY_TOPIC) är hemligt.
NTFY_URL = "https://ntfy.sh"
# Avsändare för veckobrevet. onboarding@resend.dev fungerar utan egen domän,
# men bara till adressen som Resend-kontot är registrerat på.
MAIL_FROM = "LövGlöd <onboarding@resend.dev>"

# Hemligheter, inte här:
#   npx wrangler secret put ADMIN_TOKEN
#   npx wrangler secret put NTFY_TOPIC       # signal om nya lampor (valfri)
#   npx wrangler secret put RESEND_API_KEY   # veckobrevet (valfri)
#   npx wrangler secret put MAIL_TO          # mottagare, kommaseparerat

[[d1_databases]]
binding = "DB"
database_name = "lovglod-telemetri"
database_id = "0176faad-17f4-443f-adaf-988cdca8d4bf"
